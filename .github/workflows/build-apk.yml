name: Build MicroMasters APK

on:
  push:
    branches:
      - "claude/beautiful-euler-8659ry"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias micromasters \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass micromasters -keypass micromasters \
            -dname "CN=MicroMasters, OU=Game, O=MicroMasters, L=City, ST=State, C=HU"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASS=micromasters"
            echo "KEY_ALIAS=micromasters"
            echo "KEY_PASS=micromasters"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage APK as MicroMasters.apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MicroMasters.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroMasters-apk
          path: out/MicroMasters.apk
          if-no-files-found: error

      - name: Publish APK to a rolling release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build out/MicroMasters.apk \
            --title "MicroMasters — legfrissebb build" \
            --notes "Aláírt, **nem debuggolható** release build a(z) ${{ github.sha }} commitból. Töltsd le a **MicroMasters.apk** fájlt, és telepítsd Android eszközre (engedélyezd az ismeretlen forrásokat). Frissítéskor előbb távolítsd el a korábbi verziót, mert minden build új aláírókulcsot kap." \
            --prerelease
